<style>
/* Formato visual de la app OEE Planta (tema oscuro, IBM Plex) */
:root{--bg:#0f1117;--bg2:#181b24;--bg3:#1e2130;--border:#2a2e3f;--text:#e8eaf0;--text2:#8b8fa8;--text3:#555870;--blue:#4a9eff;--green:#3ecf8e;--amber:#f5a623;--red:#f06060;--radius:8px;--radius-lg:12px;
  --mono:'IBM Plex Mono',ui-monospace,monospace;color-scheme:dark;
  /* nombres que usa el código de la app → paleta OEE */
  --card:var(--bg2);--tx:var(--text);--mut:var(--text2);--bd:var(--border);--ac:var(--blue);
  --ok:var(--green);--wa:var(--amber);--er:var(--red);--in:var(--text2);--inb:rgba(139,143,168,.15);
  /* dibujo del tubo sobre fondo oscuro */
  --tube:#343a50;--chuck:#555870;--hd1:#232736;--hd2:#3a3f55;--hdt:#8b8fa8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* menú lateral */
.sidebar{width:220px;min-width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:5;transition:width .25s cubic-bezier(.4,0,.2,1),min-width .25s cubic-bezier(.4,0,.2,1)}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:1.1rem 1.1rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap;overflow:hidden}
.logo-box{width:34px;height:34px;flex-shrink:0;background:#fff;border-radius:9px;padding:5px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.logo-box img{width:100%;height:100%;object-fit:contain;display:block}
.logo-text{font-size:15px;font-weight:600;color:var(--text);letter-spacing:.3px;line-height:1.25}
.logo-sub{font-size:11px;color:var(--text2);margin-top:2px;font-family:var(--mono)}
#nav{flex:1;min-height:0}
.sidebar:not(.collapsed) #nav{overflow-y:auto;overflow-x:hidden}
.nav-section{padding:.75rem 0 .1rem}
.nav-label{font-size:10px;font-weight:600;color:var(--text3);padding:0 1.25rem .5rem;letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 1.25rem;cursor:pointer;font-size:13px;color:var(--text2);border-left:2px solid transparent;transition:all .18s cubic-bezier(.4,0,.2,1);white-space:nowrap;position:relative}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);border-left-color:var(--blue);font-weight:500}
.nav-item:focus-visible{outline:1px solid var(--blue);outline-offset:-1px}
.nav-item svg{width:18px;height:18px;flex-shrink:0;color:var(--ic,currentColor);filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ic) 50%,transparent));transition:filter .2s,transform .15s}
.nav-item:hover svg{transform:scale(1.1)}
.nav-item.active svg{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--ic) 90%,transparent));animation:badgePop .3s ease}
.nav-item>span:not(.nav-cnt){min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-cnt{margin-left:auto;flex-shrink:0;font-family:var(--mono)}
.sidebar-bottom{margin-top:auto;padding:.85rem 1.25rem;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.conn{font-size:10px;font-family:var(--mono)}.conn.ok{color:var(--green)}.conn.wa{color:var(--amber)}.conn.in{color:var(--text3)}
.sb-info{font-size:10px;font-family:var(--mono);color:var(--text3);line-height:1.4}
.sb-toggle{align-self:flex-start;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:var(--radius);padding:4px 8px}
.sb-toggle svg{width:14px;height:14px;transition:transform .25s}
@media (min-width:821px){

  .sidebar.collapsed .sidebar-logo{padding:1rem 0;justify-content:center}
  .sidebar.collapsed .logo-text,.sidebar.collapsed .logo-sub,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-item>span:not(.nav-cnt),.sidebar.collapsed .conn,.sidebar.collapsed .sb-info{display:none}
  .sidebar.collapsed .nav-section{padding:.4rem 0}
  .sidebar.collapsed .nav-item{padding:10px 0;justify-content:center;border-left:none;border-right:2px solid transparent}
  .sidebar.collapsed .nav-item.active{border-right-color:var(--blue)}

input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
select option{background:var(--bg2)}
input[type=number]{width:90px;font-family:var(--mono)}
input[type=checkbox]{accent-color:var(--blue)}
button{cursor:pointer;font-weight:500}
button:hover:not(:disabled){border-color:var(--blue)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}

code{font-family:var(--mono);font-size:11.5px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:0 5px}

/* tarjetas, KPIs y tablas */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.1rem 1.25rem;margin-bottom:1.1rem}
.card h3{margin:0 0 .85rem;font-size:13px;font-weight:600}
details.card>summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸';color:var(--text3);transition:transform .15s}details.card[open]>summary::before{transform:rotate(90deg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1.25rem}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.1rem;transition:transform .15s,box-shadow .15s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
.kpi span{display:block;font-size:11px;color:var(--text2);font-weight:500}
.kpi b{display:block;font-size:24px;font-weight:600;font-family:var(--mono);line-height:1.3;margin-top:4px;font-variant-numeric:tabular-nums}
:is(.main,.modal) table{border-collapse:collapse;width:100%;font-size:13px}
:is(.main,.modal) th,:is(.main,.modal) td{border-bottom:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
:is(.main,.modal) th{color:var(--text3);font-weight:500;font-size:11px;letter-spacing:.4px;text-transform:uppercase;background:var(--bg3);position:sticky;top:0;z-index:1;padding:9px 12px}

.b.er{background:rgba(240,96,96,.15);color:var(--red)}.b.in{background:rgba(139,143,168,.15);color:var(--text2)}

.row{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center}
.drop{border:1px dashed var(--border);border-radius:var(--radius-lg);padding:22px;text-align:center;color:var(--text2);background:var(--bg2);transition:border-color .15s,color .15s}
.drop.over{border-color:var(--blue);color:var(--blue)}
.empty{color:var(--text3);padding:2.5rem;text-align:center;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px 16px}
.cfl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--text2)}
.cfl>span:first-child{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.6px;text-transform:uppercase}
.cfl input{color:var(--text)}
.bar{margin:6px 0 14px}.bar svg{width:100%;height:auto;display:block}
.barhd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.barhd b{font-family:var(--mono);font-weight:500}
.prog{height:6px;background:var(--border);border-radius:3px;overflow:hidden;min-width:80px;flex:1}.prog i{display:block;height:100%;background:var(--green);border-radius:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-bottom:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;padding:10px 16px;border-radius:var(--radius-lg);box-shadow:0 8px 28px rgba(0,0,0,.45);display:none;font-size:13px;border:1px solid var(--border);background:var(--bg3);color:var(--text);max-width:min(640px,calc(100vw - 32px))}
.toast.ok{border-color:rgba(62,207,142,.5);color:var(--green)}.toast.er{border-color:rgba(240,96,96,.55);color:var(--red)}.toast.wa{border-color:rgba(245,166,35,.55);color:var(--amber)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:20px 12px;overflow:auto}
.modal>.card{width:min(1300px,100%);margin:0;animation:scaleIn .2s ease both}
.vgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px}
@media (max-width:900px){.vgrid{grid-template-columns:1fr}}
#vSvg{width:100%;height:440px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);cursor:grab;touch-action:none;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}.kv>span:nth-child(odd){color:var(--text2)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* microanimaciones (solo al cambiar de pestaña) */
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes badgePop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.content.anim .card,.content.anim .drop{animation:scaleIn .2s ease both}
.content.anim .kpi{animation:scaleIn .3s ease both}
.content.anim tr{animation:rowIn .25s ease both}
.content.anim tr:nth-child(2){animation-delay:.02s}.content.anim tr:nth-child(3){animation-delay:.04s}.content.anim tr:nth-child(4){animation-delay:.06s}
.content.anim tr:nth-child(5){animation-delay:.08s}.content.anim tr:nth-child(6){animation-delay:.10s}.content.anim tr:nth-child(7){animation-delay:.12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* celular */
@media (max-width:820px){

@media print{body{display:block;height:auto;overflow:visible;background:#fff;color:#000}.sidebar,.main,.modal,.toast{display:none!important}#printArea{display:block!important;position:static;width:auto}}

<script>
/* ===== Motor IGES: lectura, medición y combinado de piezas a lo largo de un tubo ===== */
const IGES = (() => {
  const SUP = new Set([100,102,104,106,108,110,116,118,120,122,123,124,126,128,130,140,141,142,143,144,186,190,192,194,196,198,308,314,402,406,408,502,504,508,510,514]);
  function tokenize(s, pd, rd){
    const out = []; let i = 0, n = s.length;
    while(i < n){
      while(i < n && s[i] === ' ') i++;
      const st = i; let j = i; while(j < n && s[j] >= '0' && s[j] <= '9') j++;
      if(j > i && s[j] === 'H'){ const L = parseInt(s.slice(i, j)); i = j + 1 + L; }
      while(i < n && s[i] !== pd && s[i] !== rd) i++;
      out.push(s.slice(st, i).trim());
      if(i >= n || s[i] === rd) break;
      i++;
    }
    return out;
  }
  const holl = t => { const m = /^(\d+)H/.exec(t || ''); return m ? t.substr(m[0].length, +m[1]) : (t || ''); };
  const num = t => { if(t == null || t === '') return 0; return parseFloat(String(t).replace(/D/i, 'E')); };
  function parse(text){
    const lines = text.split(/\r?\n/).filter(l => l.length >= 73);
    let S = [], G = '', D = [], P = {};
    for(const l of lines){
      const c = l[72];
      if(c === 'S') S.push(l.slice(0, 72));
      else if(c === 'G') G += l.slice(0, 72);
      else if(c === 'D') D.push(l.slice(0, 72));
      else if(c === 'P'){ const de = parseInt(l.slice(64, 72)); P[de] = (P[de] || '') + l.slice(0, 64); }
    }
    let pd = ',', rd = ';';
    if(/^1H./.test(G)){ pd = G[2]; const r = G.slice(4); if(/^1H./.test(r)) rd = r[2]; }
    const g = tokenize(G, pd, rd);
    const ents = [];
    for(let k = 0; k + 1 < D.length; k += 2){
      const a = D[k], b = D[k + 1], f = (s, i) => s.slice(i*8, i*8 + 8).trim();
      const de = k + 1;
      const e = {de, type: parseInt(f(a,0)), pptr: parseInt(f(a,1)) || 0,
        d: [f(a,2), f(a,3), f(a,4), f(a,5), f(a,6), f(a,7), f(a,8)].map(x => parseInt(x) || 0),
        status: f(a,8).padStart(8, '0'), form: parseInt(f(b,4)) || 0,
        weight: f(b,1), color: parseInt(f(b,2)) || 0, label: b.slice(56, 64), sub: f(b,8), r1: f(b,5), r2: f(b,6)};
      e.t = tokenize(P[de] || '', pd, rd);
      ents.push(e);
    }
    const byDe = {}; ents.forEach(e => byDe[e.de] = e);
    return {S, G: g, pd, rd, ents, byDe,
      unitFlag: parseInt(g[13]) || 0, unitName: holl(g[14]), scale: num(g[12]) || 1, system: holl(g[3]), file: holl(g[2])};
  }
  /* índices (en e.t) de los parámetros que son punteros; null = tipo no soportado */
  function spec(e){
    const t = e.t, I = k => parseInt(t[k]) || 0; let p = [], end = 1;
    switch(e.type){
      case 100: end = 8; break;
      case 102: { const n = I(1); for(let k = 0; k < n; k++) p.push(2 + k); end = 2 + n; break; }
      case 104: end = 12; break;
      case 106: { const ip = I(1), n = I(2); end = 3 + (ip === 1 ? 1 + 2*n : ip === 2 ? 3*n : 6*n); break; }
      case 108: p = [5]; end = 10; break;
      case 110: end = 7; break;
      case 116: p = [4]; end = Math.min(t.length, 5); if(t.length < 5) p = []; break;
      case 118: p = [1, 2]; end = 5; break;
      case 120: p = [1, 2]; end = 5; break;
      case 122: p = [1]; end = 5; break;
      case 123: end = 4; break;

          const b = bars[i], cap = capOf(b.P, c) - b.piezas.reduce((s, p) => s + p.L + c.kerf, 0);
          if(cap < 1) continue;
          const cand = []; for(let j = bars.length - 1; j > i; j--) bars[j].piezas.forEach(p => { p._k = c.kerf; p._bar = j; cand.push(p); });
          if(!cand.length) break;
          const sel = knap(cand.slice(0, 600), cap); if(!sel.length) continue;
          const ids = new Set(sel.map(p => p.uid));
          for(let j = i + 1; j < bars.length; j++) bars[j].piezas = bars[j].piezas.filter(p => !ids.has(p.uid));
          b.piezas = b.piezas.concat(sel); movio = true;
          for(let j = bars.length - 1; j > i; j--) if(!bars[j].piezas.length) bars.splice(j, 1);
        }
        if(!movio) break;
      }
      bars.forEach(b => b.piezas.forEach(p => { delete p._bar; }));
      bars.forEach(b => layout(b, c));
      bars.sort((a, b) => (a.origen === 'recorte' ? 0 : 1) - (b.origen === 'recorte' ? 0 : 1) || Math.min(...a.piezas.map(p => p.prio)) - Math.min(...b.piezas.map(p => p.prio)));
      const nuevos = bars.filter(b => b.origen === 'nuevo');
      const tot = {
        tramos: nuevos.length, recUsados: bars.length - nuevos.length,
        piezas: bars.reduce((s, b) => s + b.piezas.length, 0),
        largoPiezas: bars.reduce((s, b) => s + b.piezas.reduce((t, p) => t + p.L, 0), 0),
        consumo: bars.reduce((s, b) => s + b.consumo, 0),
        recGenerados: bars.filter(b => b.recorte).length, largoRec: bars.reduce((s, b) => s + b.recorte, 0),
        desecho: bars.reduce((s, b) => s + b.desecho, 0),
        mmNuevos: nuevos.length*c.tramo, mmRecUsados: bars.filter(b => b.origen === 'recorte').reduce((s, b) => s + b.P, 0)
      };
      tot.aprov = tot.consumo ? tot.largoPiezas/tot.consumo : 0;
      res.push({tipo, grupo, maquina: list[0].maquina || '', completo: !!list[0].completo, dibujo: list[0].completo ? list[0].pieza : '', bars, largas, tot, tramo: c.tramo});
    }
    return res;
  }
  return {run, knap};
})();

/* ======================= Nombres de Ingeniería ======================= */
const NUMRE = '(\\d+\\/\\d+|\\d+(?:[.,]\\d+)?(?:[- ]\\d+\\/\\d+)?)';   // la fracción sola va primero: si no, "3/4" se leía como "3"
function frac(s){ s = String(s).replace(',', '.'); return s.split(/[- ]/).reduce((t, p) => { const m = p.match(/^(\d+)\/(\d+)$/); return t + (m ? m[1]/m[2] : (parseFloat(p) || 0)); }, 0); }
const POT2 = new Set(['2', '4', '8', '16', '32', '64']);
function parseMedida(s){
  // en un nombre de archivo no cabe "/": 1-1/2 se escribe "1 1-2" o "1-1-2" y 3/4 se escribe "3-4"
  const fr = (n, d) => POT2.has(d) && +n < +d;
  const u = norm(s).replace(/"/g, ' IN ').replace(/_/g, ' ')
    .replace(/(\d+)[ -](\d+)-(\d+)(?![\d\/.])/g, (m, w, n, d) => fr(n, d) ? `${w}-${n}/${d}` : m)
    .replace(/(^|[^\d\/.-])(\d+)-(\d+)(?![\d\/.])/g, (m, pre, n, d) => fr(n, d) ? `${pre}${n}/${d}` : m);
  // redondo: REDONDO / DIA / Ø o "TUBO 1 1/4 IN" (como lo escribe el programa), siempre que no traiga "A X B"
  let m = !new RegExp(NUMRE + '\\s*X\\s*' + NUMRE).test(u) && u.match(new RegExp('(?:REDONDO|\\bRED\\b|DIA|DIAM|Ø|\\bTUBO(?:\\s+MOFLE)?\\b|\\bMOFLE\\b)\\s*-?\\s*' + NUMRE + '\\s*(MM|IN)?'));
  if(m){ const v = frac(m[1]), mm = m[2] === 'MM' || (!m[2] && v > 8); return {forma: 'RED', a: mm ? v : v*25.4, b: mm ? v : v*25.4, pulg: !mm, txt: m[0].trim()}; }
  m = u.match(new RegExp(NUMRE + '\\s*X\\s*' + NUMRE + '\\s*(MM|IN)?'));
  if(m){ const v1 = frac(m[1]), v2 = frac(m[2]), mm = m[3] === 'MM' || (!m[3] && Math.max(v1, v2) > 8);
    const a = mm ? v1 : v1*25.4, b = mm ? v2 : v2*25.4; return {forma: Math.abs(a - b) < 0.05 ? 'CUAD' : 'RECT', a: Math.min(a, b), b: Math.max(a, b), pulg: !mm, txt: m[0].trim()}; }
  return null;
}
const inTxt = mm => { const v = mm/25.4, w = Math.floor(v + 1e-6), r = Math.round((v - w)*16); if(r === 0) return String(w); if(r === 16) return String(w + 1); let n = r, d = 16; while(n % 2 === 0){ n /= 2; d /= 2; } return (w ? w + '-' : '') + n + '/' + d; };
const inDec = mm => String(+(Math.round(mm/25.4*16)/16).toFixed(4));
function tipoDe(med, cal){
  const k = `${med.forma}-${(+med.a.toFixed(1))}x${(+med.b.toFixed(1))}-C${cal || '?'}`;
  const dim = med.pulg ? (med.forma === 'RED' ? `Ø${inTxt(med.a)} in` : `${inTxt(med.b)} × ${inTxt(med.a)} in`) : (med.forma === 'RED' ? `Ø${f1(med.a)} mm` : `${f1(med.b)} × ${f1(med.a)} mm`);
  // el corto va en IDs de tramo/recorte y en nombres de archivo: pulgadas en decimal (1.75X0.75), sin "/" ni "-"
  return {key: k, label: `${dim} · cal ${cal || '?'}`, corto: (med.pulg ? (med.forma === 'RED' ? 'D' + inDec(med.a) : inDec(med.b) + 'X' + inDec(med.a)) : Math.round(med.b) + 'X' + Math.round(med.a)) + '-C' + (cal || 'X')};
}
function kgPorM(med, cal){
  const t = CFG.calibres[String(cal)]; if(!t || !med) return null;
  const area = med.forma === 'RED' ? Math.PI/4*(med.a**2 - (med.a - 2*t)**2) : med.a*med.b - (med.a - 2*t)*(med.b - 2*t);
  return area*CFG.densidad/1000;
}

function largoDeDesc(d){ const m = norm(d).replace(',', '.').match(/(\d+(?:\.\d+)?)\s*M(?:TS?|ETROS?)?\b/); return m ? Math.round(+m[1] < 20 ? +m[1]*1000 : +m[1]) : null; }
function catalogo(){

/* SKU del catálogo que corresponden a un tubular (misma forma y calibre, sección a ±0.6 mm) */
function skusDe(key){
  const m = /^(RED|CUAD|RECT)-([\d.]+)x([\d.]+)-C(\w+)$/.exec(key || ''); if(!m) return [];
  const red = m[1] === 'RED', a = +m[2], b = +m[3];
  return catalogo().filter(c => c.med && c.cal === m[4] && (c.med.forma === 'RED') === red && Math.abs(c.med.a - a) <= 0.6 && Math.abs(c.med.b - b) <= 0.6);
}

const tramoDe = key => { const s = skuDe(key); return s ? s.largo : CFG.tramo; };

function parseNombre(name, path){
  const r = {name, path: path || '', ok: false, errores: []};
  if(/subiendo/i.test(name)){ r.excluir = 'Carga incompleta (subiendo)'; return r; }
  if(/prototipo/i.test(path || '')){ r.excluir = 'Carpeta de prototipos'; return r; }
  const m = name.match(/^(.+?)_(\d+)\s*PZA?S?_(.+?)\s+v(\d+)\s*\(([^)]*)\)\.(igs|iges)((?:\.gz)*)$/i);
  if(!m) return parsePlanta(name, path, r);
  r.ruta = m[1].trim(); r.n = +m[2]; r.v = +m[4]; r.fecha = m[5]; r.gz = !!m[7];
  const toks = m[3].split('_'); let ci = toks.findIndex(t => /^CAL\.?\s*\d+$/i.test(t));
  if(ci < 0){ r.errores.push('No indica calibre (CALxx)'); r.pieza = m[3]; r.matTxt = m[3]; }
  else { r.cal = (toks[ci].match(/\d+/) || [])[0]; r.matTxt = toks.slice(0, ci).join('_'); r.pieza = toks.slice(ci + 1).join('_') || '(sin nombre)'; }
  r.med = parseMedida(r.matTxt) || (ci >= 0 ? parseMedida(toks.slice(ci + 1).join('_')) : null);
  if(r.cal && !CFG.calibres[r.cal]) r.errores.push(`Calibre ${r.cal} sin espesor en Configuración`);
  r.ok = !r.errores.length;
  return r;
}
/* nombre de dibujo normalizado: liga el "Nombre del dibujo" del programa con el archivo */
const claveDibujo = s => norm(s).replace(/\.(IGS|IGES)(\.GZ)*$/, '').replace(/[-_()]/g, ' ').replace(/\b(\d+)\s*PZ[AS]*\b/g, '$1PZ').replace(/\s+/g, ' ').trim();
/* convención de la carpeta central: LÍNEA/MODELO/IGS/nombre libre ("1015 ALMA 1PZ.IGS"); el tubular sale del programa.
   MULTIPLE / MUL = múltiple de Ingeniería; MULT = múltiple armado por la plataforma */
function parsePlanta(name, path, r){
  const base = name.replace(/\.(igs|iges)(\.gz)*$/i, '').trim(), carpetas = String(path || '').split('/').slice(0, -1);
  const pz = norm(base).match(/\b(\d+)\s*PZ[AS]*\b/), vieja = carpetas.filter(c => /ANTERIOR|VIEJ|OBSOLET/.test(norm(c))).pop();
  Object.assign(r, {ok: true, planta: true, pieza: base, clave: claveDibujo(base), n: pz ? +pz[1] : null, multiple: /\bMULT(IPLE)?\b|\bMUL\b/.test(norm(base)),
    ruta: carpetas.filter(c => !/^IGE?S$/i.test(c.trim())).pop() || ''});
  if(vieja) r.excluir = 'Versión anterior (' + vieja + ')';
  else if(/MUESTRA/.test(norm(path))) r.excluir = 'Muestra';
  return r;
}

function leerPrograma(buf, name){

/* programa por máquina: "PROGRAMA LASER #2" = GW1 y "#3" = GW2; cada hoja oculta los renglones de la otra máquina */
function leerProgramaLaser(wb, hojas){
  const ops = [], num = v => parseFloat(String(v == null ? '' : v).replace(/,/g, '')) || 0; let idx = 0;
  hojas.forEach(([sn, maq]) => {
    const ws = wb.Sheets[sn], ocultas = ws['!rows'] || [], rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: '', raw: false, blankrows: true});
    const hi = rows.findIndex(r => r.some(c => /OBSERVACIONES/i.test(c)));
    if(hi < 0) throw new Error(`En "${sn}" no encontré el encabezado (la fila con "Observaciones")`);
    const H = rows[hi].map(c => norm(c).replace(/\s+/g, ' ').trim()), col = re => H.findIndex(h => re.test(h));
    const cM = col(/^MODELO/), cO = col(/^OP$/), cQ = col(/^CANT\.?$/), cF = col(/FAMILIA/), cP = col(/^PARTE/), cT = col(/TUBULAR/), cX = col(/X MUEBLE/), cG = col(/PROGRA/), cD = col(/DIBUJO/), cB = col(/OBSERVACIONES/), cC = col(/^CORTADO/);
    if(cD < 0 || cT < 0) throw new Error(`En "${sn}" faltan las columnas "Nombre del dibujo" o "Tubular"`);
    rows.slice(hi + 1).forEach((r, i) => {
      const fila = hi + 1 + i; if(ocultas[fila] && ocultas[fila].hidden) return;
      const dib = String(r[cD] == null ? '' : r[cD]).trim(), txt = r.join(' ');
      if(!dib || /TOTAL/i.test(txt) || /#N\/A|#REF!/i.test(txt)) return;
      const v = c => c >= 0 ? String(r[c] == null ? '' : r[c]).trim() : '';
      const o = {maquina: maq, hoja: sn, fila: fila + 1, op: v(cO) || sn + ' fila ' + (fila + 1), ruta: v(cM), familia: v(cF), parte: v(cP), desc: v(cP), tubular: v(cT),
        cant: num(r[cQ]), xMueble: num(r[cX]), progra: num(r[cG]), dibujo: dib, obs: v(cB), inicio: null, idx: idx++};
      if(/NO CORTAR/i.test(dib)) o.omitir = dib;
      else if(/^(SI|SÍ|X|✓|TRUE|VERDADERO|1)$/i.test(v(cC))) o.omitir = 'Ya marcado como cortado';
      else if(/DIBUJO EN (LA )?MAQUINA/.test(norm(dib))) o.omitir = 'Dibujo en la máquina (no se acomoda)';
      ops.push(o);
    });
  });
  // "IGUAL A FA-6530": toma el dibujo del renglón de esa OP con la misma parte (o la misma letra final)
  ops.forEach(o => { const m = norm(o.dibujo).match(/^IGUAL (?:A|QUE)\s+(.+)$/); if(!m) return;
    const ref = m[1].trim(), suf = (norm(o.ruta).match(/-([A-Z])$/) || [])[1];
    const cand = ops.filter(x => x !== o && !/^IGUAL /.test(norm(x.dibujo)) && norm(x.ruta).startsWith(ref));
    const x = cand.find(x => x.parte && norm(x.parte) === norm(o.parte)) || (suf && cand.find(x => norm(x.ruta) === ref + '-' + suf));
    if(x) Object.assign(o, {dibujoOrig: o.dibujo, dibujo: x.dibujo, nota: 'Igual a ' + x.ruta}); });
  // sin nombre de dibujo ("0"): se busca por la parte
  ops.forEach(o => { if(o.dibujo === '0' && o.parte) Object.assign(o, {dibujoOrig: o.dibujo, dibujo: o.parte, nota: 'Sin nombre de dibujo: se buscó por la parte'}); });
  if(!ops.length) throw new Error('Las hojas PROGRAMA LASER #2 y #3 no traen renglones visibles');
  return ops;
}
/* Excel de órdenes planificadas de Business Central (Nº ruta + Cantidad) */
function leerProgramaBC(wb){
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: '', raw: true});
  const hi = rows.findIndex(r => r.some(c => /RUTA/i.test(c)) && r.some(c => /^CANTIDAD$/i.test(String(c).trim())));
  if(hi < 0) throw new Error('No encontré las columnas "Nº ruta" y "Cantidad"');
  const H = rows[hi].map(c => norm(c).trim()), col = re => H.findIndex(h => re.test(h));
  const cOP = col(/^N[º°O]?\.?$/), cR = col(/RUTA/), cQ = col(/^CANTIDAD$/), cI = col(/FECHA.?HORA INICIAL|HORA INICIAL|FECHA INICIAL|INICIO/), cD = col(/DESCRIPCI/), cC = col(/PROCEDENCIA/);
  const ops = [];

  });

}

function vigentes(){
  // por ruta+pieza: la versión más alta; empates sin elección → excluidos y marcados
  const g = {}; S.lib.forEach(f => { if(f.p.planta || (!f.p.ok && !f.p.ruta)) return; if(f.p.excluir) return; const k = norm(f.p.ruta) + '|' + norm(f.p.pieza); (g[k] = g[k] || []).push(f); });
  const vig = [], conflictos = [];
  for(const [k, l] of Object.entries(g)){
    const vmax = Math.max(...l.map(f => f.p.v)), top = l.filter(f => f.p.v === vmax);
    l.forEach(f => { f.estadoVer = f.p.v < vmax ? 'anterior' : ''; });
    if(top.length === 1) vig.push(top[0]);
    else { const e = ELEC[k] && top.find(f => f.id === ELEC[k]);
      if(e){ vig.push(e); top.filter(f => f !== e).forEach(f => f.estadoVer = 'descartado'); }
      else { top.forEach(f => f.estadoVer = 'empate'); conflictos.push({k, files: top}); } }
  }
  return {vig, conflictos};
}

  else if(Math.abs(m.secA - p.med.b) > CFG.tolSeccion || Math.abs(m.secB - p.med.a) > CFG.tolSeccion){ r.lv = 'er'; r.notas.push(`La sección del IGS (${f1(m.secA)} × ${f1(m.secB)} mm) no coincide con el nombre (${f1(p.med.b)} × ${f1(p.med.a)} mm)`); }
  if(m.units && !/MM|MILLIM/.test(m.units)) r.notas.push('Unidades ' + m.units + ' (convertidas a mm)');
  if(!m.combinable){ r.lv = r.lv === 'er' ? 'er' : 'wa'; r.notas.push('Entidades no soportadas para el IGS combinado: ' + Object.keys(m.unsup).join(', ')); }
  if(m.wall != null && f.p.cal && CFG.calibres[f.p.cal] && Math.abs(m.wall - CFG.calibres[f.p.cal]) > 0.15){ r.lv = r.lv === 'er' ? 'er' : 'wa'; r.notas.push(`Pared medida ${f2(m.wall)} mm; el calibre ${f.p.cal} es ${f2(CFG.calibres[f.p.cal])} mm`); }
  const med = medidaEfectiva(f), Tt = med && f.p.cal ? tramoDe(tipoDe(med, f.p.cal).key) : CFG.tramo;

/* liga cada renglón del programa por máquina con su IGS de la carpeta central; un nombre repetido se decide por el modelo */
function ligarDibujos(){
  const vig = {}, viejos = {};
  S.lib.forEach(f => { if(f.p.planta) ((f.p.excluir ? viejos : vig)[f.p.clave] = (f.p.excluir ? viejos : vig)[f.p.clave] || []).push(f); });
  const alnum = s => norm(s).replace(/^F[AC]?\s*-?\s*(\d{3,})/, 'F$1').replace(/[^A-Z0-9]/g, '');
  S.match = {};
  S.ops.forEach(o => {
    if(o.omitir) return;
    const k = claveDibujo(o.dibujo), cand = vig[k] || [], ant = viejos[k] || [], elec = ELEC['D|' + k + '|' + norm(o.ruta)];
    let f = elec && cand.concat(ant).find(x => x.id === elec), estado = 'ok', iguales = 0;
    if(!f && cand.length === 1) f = cand[0];
    else if(!f && cand.length > 1){
      // desempate: carpeta del modelo; o carpeta con el número del dibujo ("1212-ALMA…" → 1212 antes que 1212-1); un nombre genérico ("ALMA GRANDE") no desempata
      const mod = alnum(o.ruta).replace(/(\d)[A-Z]$/, '$1'), tok0 = alnum(k.split(' ')[0]), tok = /\d/.test(tok0) ? tok0 : '';
      const score = x => { const cs = x.path.split('/').slice(0, -1).map(alnum).filter(Boolean);
        return (mod && cs.some(c => c === mod || (c.length >= 3 && mod.length >= 3 && (c.includes(mod) || mod.includes(c)))) ? 4 : 0) + (tok && cs.some(c => c === tok) ? 2 : tok && cs.some(c => c.startsWith(tok)) ? 1 : 0); };
      const sc = cand.map(x => [x, score(x)]).sort((a, b) => b[1] - a[1] || a[0].path.localeCompare(b[0].path));
      if(sc[0][1] > 0 && sc[0][1] > sc[1][1]) f = sc[0][0];
      // el mismo dibujo copiado en varios modelos (mismo tamaño en todos): cualquiera sirve, se usa el primero
      else if(cand.every(x => x.size && x.size === cand[0].size)){ f = sc[0][0]; iguales = cand.length; }
      else estado = 'ambiguo';
    } else if(!f) estado = ant.length ? 'anterior' : 'sin';
    S.match[o.idx] = {f: f || null, estado: f ? 'ok' : estado, clave: k, iguales, cand: f ? (iguales ? cand : []) : estado === 'ambiguo' ? cand : estado === 'anterior' ? ant : []};
  });
}

/* ======================= Explosión del programa ======================= */
function explotar(){
  S.items = []; S.fuera = []; S.sinTub = [];
  if(S.formato === 'laser') return explotarLaser();
  const {vig} = vigentes(); const porRuta = {};
  vig.forEach(f => (porRuta[norm(f.p.ruta)] = porRuta[norm(f.p.ruta)] || []).push(f));
  let uid = 0;
  S.ops.forEach(o => {
    const pz = porRuta[norm(o.ruta)];
    if(!pz){ S.sinTub.push(o); return; }
    pz.forEach(f => {
      const ev = evalPieza(f), m = MEAS[medKey(f)], med = medidaEfectiva(f);
      const n = o.cant*f.p.n;
      if(ev.lv === 'er' || ev.lv === 'in' || !med || !m || !m.ok){ S.fuera.push({o, f, n, motivo: ev.notas.join(' · ') || 'Sin medida'}); return; }
      const t = tipoDe(med, f.p.cal);
      for(let i = 0; i < n; i++) S.items.push({uid: uid++, tipo: t.key, tipoLabel: t.label, tipoCorto: t.corto, L: m.len, prio: (o.inicio || 0) + o.idx, op: o.op, ruta: f.p.ruta, pieza: f.p.pieza, fileId: f.id, med, cal: f.p.cal});
    });
  });
}
/* programa por máquina: cada corrida de un dibujo es una unidad. Los dibujos con varias piezas (MULTIPLE o Cant. > Cant. Progra.)
   se respetan tal cual y solo comparten tramo con copias de sí mismos (su alta en TubesT se reutiliza);
   las piezas sueltas del mismo tubular y máquina se acomodan juntas en los tramos. */
function explotarLaser(){
  if(!S.match) ligarDibujos();
  let uid = 0;
  S.ops.forEach(o => {
    // en el programa Cant. = Cant. Progra. (muebles) × Cant. x mueble: Cant. son las piezas que hay que cortar
    const mt = S.match[o.idx] || {}, piezas = Math.round(o.cant || o.progra * o.xMueble) || 0;
    let corridas = piezas;
    const fuera = motivo => S.fuera.push({o, f: mt.f || {p: {ruta: o.ruta, pieza: o.dibujo}, id: ''}, n: corridas, motivo});
    if(o.omitir) return fuera(o.omitir);
    if(!mt.f) return fuera(mt.estado === 'ambiguo' ? `Hay ${mt.cand.length} IGS con ese nombre: elige cuál en Programa` : mt.estado === 'anterior' ? 'Solo hay versión anterior del dibujo: elige en Programa si se usa' : 'No está en la carpeta central');
    const f = mt.f, m = MEAS[medKey(f)];
    if(!m) return fuera('Sin leer');
    if(m.error) return fuera(m.error);
    const med = parseMedida(o.tubular), cal = (norm(o.tubular).match(/CAL\.?\s*(\d+)/) || [])[1];
    if(!med) return fuera(`No entiendo el tubular del programa: "${o.tubular}"`);
    if(Math.abs(m.secA - med.b) > CFG.tolSeccion || Math.abs(m.secB - med.a) > CFG.tolSeccion) return fuera(`La sección del IGS (${f1(m.secA)} × ${f1(m.secB)} mm) no coincide con el tubular del programa (${o.tubular})`);
    if(!m.combinable) return fuera('Entidades no soportadas para el IGS: ' + Object.keys(m.unsup).join(', '));
    const t = tipoDe(med, cal), Tt = tramoDe(t.key);
    if(m.len + CFG.refr + CFG.chuck > Tt) return fuera(`Mide ${f0(m.len)} mm: no cabe en el tramo útil de ${f0(Tt - CFG.chuck - CFG.refr)} mm`);
    if(!piezas) return fuera('Sin cantidad programada');
    // un MULTIPLE trae varias piezas: se corre Cant. ÷ piezas por dibujo ("(3PZ)" en el nombre); si el nombre no lo dice, no se puede calcular
    const completo = !!f.p.multiple || (f.p.n || 1) > 1, pzs = completo ? (f.p.n > 1 ? f.p.n : +PZM[f.p.clave] || 0) : 1;
    if(completo && !pzs) return fuera('MULTIPLE sin número de piezas en el nombre: escribe cuántas piezas trae');
    corridas = Math.ceil(piezas / pzs);
    for(let i = 0; i < corridas; i++) S.items.push({uid: uid++, tipo: t.key, tipoLabel: t.label, tipoCorto: t.corto, L: m.len, prio: o.idx, op: o.op, ruta: o.ruta, pieza: o.dibujo, fileId: f.id,
      med, cal, pzs, completo, maquina: o.maquina, grupo: o.maquina + '|' + t.key + (completo ? '|' + f.id : '')});
  });
}
const TIPOS = () => { const t = {}; S.items.forEach(i => t[i.tipo] = t[i.tipo] || {key: i.tipo, label: i.tipoLabel, corto: i.tipoCorto, med: i.med, cal: i.cal}); (S.db.recortes || []).forEach(r => { if(!t[r.tipo]) t[r.tipo] = {key: r.tipo, label: r.tipoLabel || r.tipo, corto: r.tipoCorto || r.tipo}; }); return t; };

/* ======================= Optimización ======================= */
function generar(){
  if(!S.items.length) return toast('No hay piezas de tubular para el programa', 'er');
  const recDisp = (S.db.recortes || []).filter(r => r.estado === 'Disponible').map(r => ({id: r.id, tipo: r.tipo, largo: +r.largo}));
  const c = {tramo: CFG.tramo, tramoDe, chuck: CFG.chuck, refr: CFG.refr, kerf: CFG.kerf, minRem: CFG.minRem, modo: CFG.modo, ventana: CFG.ventana};
  const res = OPT.run(S.items, CFG.usarRecortes === false ? [] : recDisp, c);
  // el ID es por minuto: si ya hay un programa con ese ID se agrega b, c… para no sobrescribirlo al guardar
  const base = 'MT-' + hoyId(), T = TIPOS(); let pid = base;
  for(let k = 1; (S.db.programas || []).some(p => p.id === pid); k++) pid = base + String.fromCharCode(97 + k);
  // el consecutivo es por tubular aunque haya varios grupos (máquinas o dibujos completos) del mismo tubular
  const cons = {}, sello = Date.now().toString(36).slice(-4).toUpperCase();
  res.sort((a, b) => String(a.maquina).localeCompare(String(b.maquina)) || String(a.tipo).localeCompare(String(b.tipo)) || (a.completo ? 0 : 1) - (b.completo ? 0 : 1));
  res.forEach(g => { const t = T[g.tipo], s = skuDe(g.tipo); g.label = t.label; g.corto = t.corto; g.kgm = kgmDe(g.tipo); g.sku = s ? s.sku : ''; g.nSku = skusDe(g.tipo).length;
    g.bars.forEach(b => { const n = cons[t.corto] = (cons[t.corto] || 0) + 1, nn = String(n).padStart(2, '0');
      b.id = `${pid}-${t.corto}-${nn}`; b.tipoLabel = t.label; b.maquina = g.maquina; b.completo = g.completo;
      if(b.recorte) b.recorteNuevo = 'R' + t.corto + '-' + sello + nn; }); });
  S.res = {id: pid, fecha: Date.now(), cfg: c, grupos: res, archivo: S.progFile, guardado: false}; S.consSel = null;
  showTab('mult'); toast('Múltiples generados');
}
async function guardarPrograma(){
  const R = S.res; if(!R) return; if(R.guardado) return toast('Este programa ya está guardado', 'in');
  // la misma OP en dos programas vigentes = piezas cortadas dos veces
  const opsR = [...new Set(R.grupos.flatMap(g => g.bars.flatMap(b => b.piezas.map(p => String(p.op)))))];
  const previos = (S.db.programas || []).filter(p => p.estado !== 'Cancelado' && p.id !== R.id).map(p => ({id: p.id, ops: String(p.ops ?? '').split(/\s*,\s*/).filter(o => opsR.includes(o))})).filter(p => p.ops.length);
  if(previos.length && !confirm(`Estas OPs ya están en otro programa guardado:\n${previos.map(p => `• ${p.id}: ${p.ops.join(', ')}`).join('\n')}\n\nSi lo guardas, esas piezas se cortarían dos veces. ¿Guardar de todas formas?`)) return;
  const tramos = [], recNuevos = [], recUsados = [];
  R.grupos.forEach(g => g.bars.forEach((b, i) => {
    tramos.push({id: b.id, programa: R.id, tipo: g.tipo, tipoLabel: g.label, orden: i + 1, largo: b.P, origen: b.origen, recorteUsado: b.recorteId || '', recorteNuevo: b.recorteNuevo || '', largoRecorte: b.recorte, consumo: b.consumo, aprov: b.aprov, estado: 'Pendiente', inicio: '', fin: '', maquina: b.maquina || '',
      piezas: b.piezas.map(p => Object.assign({x: +p.x.toFixed(1), L: +p.L.toFixed(1), op: p.op, ruta: p.ruta, pieza: p.pieza, fileId: p.fileId, consumo: +p.consumo.toFixed(1)}, p.pzs > 1 ? {pzs: p.pzs} : {}, p.completo ? {completo: true} : {}))});
    if(b.recorteId) recUsados.push({id: b.recorteId, estado: 'Reservado', programa: R.id, tramo: b.id});
    if(b.recorteNuevo) recNuevos.push({id: b.recorteNuevo, tipo: g.tipo, tipoLabel: g.label, tipoCorto: g.corto, largo: b.recorte, estado: 'Por generar', origen: b.id, programa: R.id, ubicacion: '', alta: '__NOW__'});
  }));
  const tot = R.grupos.reduce((s, g) => (s.tramos += g.tot.tramos, s.piezas += g.tot.piezas, s), {tramos: 0, piezas: 0});
  try{
    await API.upsert('programas', [{id: R.id, fecha: '__NOW__', archivo: R.archivo || '', tramos: tot.tramos, piezas: tot.piezas, ops: [...new Set(S.items.map(i => i.op))].join(', '), resumen: JSON.stringify(R.grupos.map(g => ({tipo: g.tipo, label: g.label, ...g.tot}))), estado: 'Pendiente'}]);
    await API.upsert('tramos', tramos);
    if(recUsados.length) await API.upsert('recortes', recUsados);
    if(recNuevos.length) await API.upsert('recortes', recNuevos);
    R.guardado = true; toast('Programa ' + R.id + ' guardado'); if(API.on()) setTimeout(() => API.cargar().then(renderAll), 2500); renderAll();
  }catch(e){ toast('No se pudo guardar: ' + e.message, 'er'); }
}

/* IGS de un tramo guardado cuando la biblioteca no está cargada en esta pantalla: se baja de Drive por su id */
async function igsSuelto(p){
  if(S.extra[p.fileId]) return S.extra[p.fileId];
  if(String(p.fileId).startsWith('L:') || !API.on()) throw new Error(`No está cargado el IGS de ${p.pieza} (${p.ruta}). Este programa se armó con IGS del equipo: cárgalos en "Biblioteca de IGS".`);
  const d = await API.archivoInfo(p.fileId);
  const f = {id: p.fileId, name: d.nombre, path: '', p: parseNombre(d.nombre, '')};
  S.raw[f.id] = d.txt; S.extra[f.id] = f; return f;
}
async function igsTramo(bar, label){
  const items = [];
  for(const p of bar.piezas){
    const f = S.lib.find(x => x.id === p.fileId) || await igsSuelto(p);
    const txt = await textoDe(f), md = f.p.med || p.med, nom = md ? [md.a, md.b] : null;
    const a = IGES.analyze(txt, nom); if(!a.ok) throw new Error(p.pieza + ': ' + a.error);
    if(!a.combinable) throw new Error(p.pieza + ': tiene entidades no soportadas (' + Object.keys(a.unsup).join(', ') + ')');
    const k = a.model.unitFlag === 1 ? 25.4 : 1; if(k !== 1) throw new Error(p.pieza + ': el IGS está en pulgadas; pídelo en mm');
    items.push({model: a.model, M: IGES.placement(a, p.x)});
  }
  return IGES.combine(items, {maxCoord: bar.P, file: bar.id + '.igs', product: bar.id, title: `${bar.id} ${label || ''} tramo ${bar.P} mm`.slice(0, 72)});
}
/* tramo de un dibujo completo (MULTIPLE de Ingeniería): se entrega el IGS original, así se reutiliza su alta en TubesT */
const esCompleto = bar => bar.completo || (bar.piezas.length > 0 && bar.piezas.every(p => p.completo) && new Set(bar.piezas.map(p => p.fileId)).size === 1);

    if(registrar) await iniciarCorte(bar.id); }
  catch(e){ toast(e.message, 'er'); }

function svgBar(b, colorOf, opts){
  opts = opts || {}; const W = 1000, H = 46, T = b.P, sc = W/Math.max(T, CFG.tramo), ch = CFG.chuck;
  let s = `<svg viewBox="-2 -2 ${W + 4} ${H + 22}" role="img" aria-label="Tramo ${esc(b.id)}"><rect x="0" y="0" width="${T*sc}" height="${H}" rx="3" fill="var(--tube)" stroke="var(--mut)" stroke-width="1"/>`;
  s += `<defs><pattern id="hR" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#c0dd97"/><line x1="0" y1="0" x2="0" y2="7" stroke="#639922" stroke-width="2"/></pattern>
    <pattern id="hD" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--hd1)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--hd2)" stroke-width="2"/></pattern></defs>`;
  b.piezas.forEach(p => { const x = p.x*sc, w = p.L*sc, c = colorOf(p);
    s += `<rect x="${x}" y="2" width="${Math.max(w, 1)}" height="${H - 4}" fill="${c}" stroke="#2c2c2a" stroke-width=".8"><title>${esc(p.pieza)} · ${esc(p.ruta)} · ${esc(p.op)} · ${f1(p.L)} mm</title></rect>`;
    if(w > 46) s += `<text x="${x + w/2}" y="${H/2 - 2}" font-size="11" text-anchor="middle" fill="#1f1f1d">${esc(p.pieza.length*6 > w ? p.pieza.slice(0, Math.max(3, Math.floor(w/6.5))) + '…' : p.pieza)}</text><text x="${x + w/2}" y="${H/2 + 12}" font-size="10" text-anchor="middle" fill="#444441">${f0(p.L)}</text>`; });
  const used = b.usado, rec = b.recorte || 0;
  if(rec){ const x0 = used*sc, w = (T - used)*sc; s += `<rect x="${x0}" y="2" width="${w}" height="${H - 4}" fill="url(#hR)"/>`; if(w > 60) s += `<text x="${x0 + w/2}" y="${H/2 + 4}" font-size="11" text-anchor="middle" fill="#27500a">♻ ${esc(b.recorteNuevo || 'recorte')} ${f0(rec)}</text>`; }

/* ======================= Seguimiento de corte ======================= */
async function iniciarCorte(id){
  const t = S.db.tramos.find(x => x.id === id); if(!t) return;
  if(['En proceso', 'Cortado', 'Cancelado'].includes(t.estado)){ renderAll(); return; } // una descarga repetida no reinicia el reloj
  // solo se cierra el tramo que estaba en proceso en esta misma máquina
  const abiertos = S.db.tramos.filter(x => x.estado === 'En proceso' && x.maquina === MAQ && x.id !== id);
  for(const a of abiertos) await terminarCorte(a.id, true);
  await API.upsert('tramos', [{id, estado: 'En proceso', maquina: MAQ, inicio: '__NOW__'}]); renderAll();
}
async function terminarCorte(id, silencioso){
  const t = S.db.tramos.find(x => x.id === id); if(!t) return;
  await API.upsert('tramos', [{id, estado: 'Cortado', fin: '__NOW__', inicio: t.inicio || '__NOW__'}]);
  const r = [];
  if(t.recorteNuevo) r.push({id: t.recorteNuevo, estado: 'Disponible', disponibleDesde: '__NOW__'});
  if(t.recorteUsado) r.push({id: t.recorteUsado, estado: 'Usado', usadoEn: t.id});
  if(r.length) await API.upsert('recortes', r);
  const prog = S.db.programas.find(p => p.id === t.programa);
  if(prog && prog.estado !== 'Cancelado'){ const ts = S.db.tramos.filter(x => x.programa === prog.id); const est = ts.every(x => x.estado === 'Cortado' || x.estado === 'Cancelado') ? 'Cortado' : 'En proceso'; if(prog.estado !== est) await API.upsert('programas', [{id: prog.id, estado: est}]); }
  if(!silencioso){ toast('Tramo ' + id + ' cortado' + (t.recorteNuevo ? ' · recorte ' + t.recorteNuevo + ' disponible' : '')); renderAll(); }
}
/* cancela los tramos pendientes de un programa: libera los recortes reservados y anula los que se iban a generar */
async function cancelarPrograma(pid){
  const ts = S.db.tramos.filter(t => t.programa === pid), pend = ts.filter(t => t.estado === 'Pendiente');
  if(ts.some(t => t.estado === 'En proceso')) return toast('Hay un tramo en proceso: termínalo antes de cancelar', 'er');
  if(!pend.length) return toast('Este programa no tiene tramos pendientes', 'in');
  const hechos = ts.filter(t => t.estado === 'Cortado').length;
  if(!confirm(`¿Cancelar ${pend.length} tramo(s) pendiente(s) del programa ${pid}?${hechos ? ` Los ${hechos} ya cortados se conservan.` : ''} Los recortes reservados vuelven a quedar disponibles.`)) return;
  try{
    await API.upsert('tramos', pend.map(t => ({id: t.id, estado: 'Cancelado'})));
    const r = [];
    pend.forEach(t => { if(t.recorteUsado) r.push({id: t.recorteUsado, estado: 'Disponible', tramo: ''}); if(t.recorteNuevo) r.push({id: t.recorteNuevo, estado: 'Cancelado', baja: '__NOW__'}); });
    if(r.length) await API.upsert('recortes', r);
    await API.upsert('programas', [{id: pid, estado: 'Cancelado'}]);
    toast('Programa ' + pid + ' cancelado'); renderAll();
  }catch(e){ toast('No se pudo cancelar: ' + e.message, 'er'); }
}

    hi = rows.findIndex(r => { const h = N(r); return h.some(x => /COD.*BARRA/.test(x)) && h.some(x => /REQUERID/.test(x)); });

/* consumo real del programa contra lo esperado en BC, por tubular y (si el reporte es por OP) por OP; todo en TRA */
function compararBC(C){

  const sinCat = new Map(), otros = new Map(), fueraOP = new Set(), filas = [];
  BC.filas.forEach(f => { const c = skuPorCodigo(f.sku);
    if(!c || !c.key){ (f.unidad === 'TRA' || /TUBULAR|PTR/.test(norm(f.desc)) ? sinCat : otros).set(f.sku, f.desc + (f.unidad ? ' (' + f.unidad + ')' : '')); return; }
    if(BC.formato === 'op' && !opsProg.has(norm(f.op).trim())){ fueraOP.add(f.op); return; }
    filas.push(Object.assign({}, f, {key: keyDeSku[f.sku] || c.key})); });
  const porTipo = {};
  C.porTipo.forEach(t => porTipo[t.key] = {key: t.key, tipo: t.tipo, skus: new Set(t.sku ? [t.sku] : []), tramo: t.tramo, kgm: t.kgm, real: t.consumo/t.tramo, tramos: t.tramos, bc: 0, consumida: null, filasBC: 0});
  filas.forEach(f => { const c = skuPorCodigo(f.sku), x = porTipo[f.key] = porTipo[f.key] || {key: f.key, tipo: tipoDe(c.med, c.cal).label, skus: new Set(), tramo: c.largo, kgm: c.kgm, real: 0, tramos: 0, bc: 0, consumida: null, filasBC: 0};
    x.skus.add(f.sku); x.bc += f.esperada; x.filasBC++; if(f.consumida != null) x.consumida = (x.consumida || 0) + f.consumida; });
  const porOP = {};
  if(BC.formato === 'op'){
    C.porOP.forEach(o => { const k = norm(o.op).trim() + '|' + o.key; porOP[k] = {op: o.op, key: o.key, tipo: o.tipo, sku: o.sku, real: o.consumo/o.tramo, bc: 0, consumida: null, filasBC: 0}; });
    filas.forEach(f => { const k = norm(f.op).trim() + '|' + f.key, x = porOP[k] = porOP[k] || {op: f.op, key: f.key, tipo: porTipo[f.key].tipo, sku: f.sku, real: 0, bc: 0, consumida: null, filasBC: 0};
      x.bc += f.esperada; x.filasBC++; if(f.consumida != null) x.consumida = (x.consumida || 0) + f.consumida; });
  }
  return {formato: BC.formato, porTipo: Object.values(porTipo).map(x => Object.assign(x, {skus: [...x.skus]})), porOP: Object.values(porOP).sort((a, b) => String(a.op).localeCompare(String(b.op)) || String(a.tipo).localeCompare(String(b.tipo))),

}

function dibujarVista(svg, r, V){
  const ia = V === 'YZ' ? 1 : 0, ib = V === 'XY' ? 1 : 2, P = q => [q[ia], -q[ib]];
  const L = r.len, W = r.secA, H = r.secB;
  const ext = V === 'YZ' ? {x0: -W/2, x1: W/2, y0: -H/2, y1: H/2} : {x0: 0, x1: L, y0: -(V === 'XY' ? W : H)/2, y1: (V === 'XY' ? W : H)/2};

  let g = '', ann = '';
  const lines = r.polys.map(pl => ({d: pl.p.map((q, i) => (i ? 'L' : 'M') + P(q).map(v => +v.toFixed(3)).join(',')).join(''), c: pl.feat ? '#d85a30' : pl.end ? 'var(--ac)' : 'var(--tx)'}));
  lines.forEach(l => g += `<path d="${l.d}" fill="none" stroke="${l.c}" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`);
  const dimH = (x0, x1, y, txt, col) => `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/><line x1="${x0}" y1="${y - fs*.4}" x2="${x0}" y2="${y + fs*.4}" stroke="${col}" vector-effect="non-scaling-stroke"/><line x1="${x1}" y1="${y - fs*.4}" x2="${x1}" y2="${y + fs*.4}" stroke="${col}" vector-effect="non-scaling-stroke"/><text x="${(x0 + x1)/2}" y="${y - fs*.35}" font-size="${fs}" text-anchor="middle" fill="${col}">${txt}</text>`;
  const dimV = (y0, y1, x, txt, col) => `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${col}" vector-effect="non-scaling-stroke"/><text x="${x + fs*.4}" y="${(y0 + y1)/2 + fs*.35}" font-size="${fs}" fill="${col}">${txt}</text>`;
  let top = ext.y0, extraTop = 0;
  if(V === 'YZ'){
    ann += dimH(-W/2, W/2, H/2 + fs*1.8, f1(W) + ' mm', 'var(--ac)') + dimV(-H/2, H/2, W/2 + fs*.8, f1(H) + ' mm', 'var(--ac)');

  } else {
    const hh = (ext.y1 - ext.y0);
    ann += dimH(0, L, ext.y1 + fs*1.8, f1(L) + ' mm', 'var(--ac)') + dimV(ext.y0, ext.y1, L + fs*.8, f1(hh) + ' mm', 'var(--ac)');
    const fe = r.feats.filter(x => V === 'XY' ? x.caras.some(c => c[0] === 'Z' || c[0] === 'R') || !x.caras.length : x.caras.some(c => c[0] === 'Y' || c[0] === 'R') || !x.caras.length);
    const ofs = fs*.85;
    fe.forEach((x, i) => { const row = i % 3, yt = ext.y0 - fs*(1.4 + row*1.6);
      ann += `<line x1="${x.x}" y1="${ext.y0}" x2="${x.x}" y2="${yt + ofs*.3}" stroke="#d85a30" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/><text x="${x.x}" y="${yt}" font-size="${ofs}" text-anchor="middle" fill="#d85a30">${f1(x.x)}${x.diam ? ' · Ø' + f1(x.diam) : ''}</text>`; });
    if(fe.length){ extraTop = fs*(1.4 + Math.min(fe.length, 3)*1.6 + 1.5); ann += `<text x="0" y="${ext.y0 - extraTop + fs*.6}" font-size="${ofs}" fill="#d85a30">Cotas desde el extremo izquierdo (mm)</text>`; }
    ann += `<text x="0" y="${ext.y1 + fs*3.8}" font-size="${fs*.85}" fill="var(--mut)">Izq.: ${esc(endTxt(r.ends[0]))}</text><text x="${L}" y="${ext.y1 + fs*3.8}" font-size="${fs*.85}" text-anchor="end" fill="var(--mut)">Der.: ${esc(endTxt(r.ends[1]))}</text>`;
  }
  svg.innerHTML = `<g>${g}</g><g>${ann}</g>`;
  const pad = big*0.06 + fs*2;
  const vb = {x: ext.x0 - pad, y: ext.y0 - pad - extraTop, w: (ext.x1 - ext.x0) + 2*pad + fs*6, h: (ext.y1 - ext.y0) + 2*pad + extraTop + fs*4.5};
  setVB(svg, vb); svg._home = Object.assign({}, vb);
  if(!svg._pz){ svg._pz = 1;
    svg.addEventListener('wheel', e => { e.preventDefault(); const v = svg._vb, b = svg.getBoundingClientRect(), z = e.deltaY > 0 ? 1.15 : 1/1.15;
      const s = Math.max(v.w/b.width, v.h/b.height), ox = (b.width*s - v.w)/2, oy = (b.height*s - v.h)/2;
      const mx = v.x - ox + (e.clientX - b.left)*s, my = v.y - oy + (e.clientY - b.top)*s;
      setVB(svg, {x: mx - (mx - v.x)*z, y: my - (my - v.y)*z, w: v.w*z, h: v.h*z}); }, {passive: false});
    let drag = null;
    svg.addEventListener('pointerdown', e => { drag = {x: e.clientX, y: e.clientY, v: Object.assign({}, svg._vb)}; svg.setPointerCapture(e.pointerId); });
    svg.addEventListener('pointermove', e => { if(!drag) return; const b = svg.getBoundingClientRect(), s = Math.max(drag.v.w/b.width, drag.v.h/b.height);
      setVB(svg, {x: drag.v.x - (e.clientX - drag.x)*s, y: drag.v.y - (e.clientY - drag.y)*s, w: drag.v.w, h: drag.v.h}); });
    svg.addEventListener('pointerup', () => drag = null);
    svg.addEventListener('dblclick', () => setVB(svg, Object.assign({}, svg._home)));
  }
}
